name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: "22"}
      - name: Install Python dependencies
        run: pip install -r requirements-catalog.txt -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Catalog and contracts
        run: python tools/validate_contracts.py
      - name: Capability map
        run: |
          if [ -f docs/b2-capabilities.md ]; then
            python tools/validate_contracts.py --capability-map docs/b2-capabilities.md
          fi
      - name: Generated files are current
        run: python tools/generate_catalog.py --check
      - name: Markdown links
        run: python tools/check_markdown_links.py
      - name: TypeScript examples
        run: |
          if [ -f tools/run_ts_examples.sh ]; then
            bash tools/run_ts_examples.sh
          fi
      - name: JSON files are valid
        run: git ls-files '*.json' | xargs -r -n1 python -m json.tool > /dev/null
  applications:
    name: Application ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [voice-dataset-ingest, voice-generation-artifacts, voice-session-archive]
    defaults:
      run:
        working-directory: applications/${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Install
        run: "pip install --only-binary :all: -r requirements-dev.txt -e ."
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
