schema_version: 1.0.0
updated: "2026-10-15"
canonical_documentation: https://www.backblaze.com/docs/cloud-storage-ai-machine-learning
architectures:
  - id: voice-training-data-lifecycle
    name: Voice training data lifecycle
    slug: voice-training-data-lifecycle
    summary: Collect speech with consent, validate and review it, and publish immutable dataset releases that NeMo, Lhotse, Hugging Face Datasets, WebDataset and MosaicML Streaming read from B2.
    audience:
      - ML engineers
      - Data engineers
      - Speech and audio researchers
      - Platform engineers
    problem: Speech datasets need a record of consent per clip, repeatable validation, reviewed transcripts and versioned releases that training jobs in other locations can read and cite exactly.
    workflow:
      - Record consent in the protected zone
      - Upload clips with presigned PUT URLs
      - Validate and normalize on signed Event Notifications
      - Review transcripts in Label Studio
      - Build an immutable release with manifests and shards
      - Read the release through a local cache for training
    boundaries:
      - real-time-voice-transport
      - low-latency-session-store
      - message-queue
      - transcription-or-voice-model
      - workflow-orchestrator
      - metadata-catalog
      - vector-database
      - gpu-cache-or-training-storage
    capabilities:
      - S3-compatible API
      - Presigned URLs and CORS
      - Multipart upload with resume
      - Application keys with limited scope
      - Event Notifications with a signed, idempotent webhook
      - Versions and lifecycle rules
      - Server-side encryption
      - Object Lock
      - Cloud Replication
      - Included egress and compute partners
      - Local processing or GPU cache
      - B2 Overdrive for sustained reads only
    integrations:
      - id: nemo
        name: NVIDIA NeMo
        role: Speech model training on NeMo JSONL manifests
        connection: Reads releases through its Lhotse data loader, or from a local copy; its own object-store support is documented for AIStore
        connection_type: application-copy
        url: https://docs.nvidia.com/nemo-framework/user-guide/latest/nemotoolkit/asr/datasets.html
        evidence: NeMo ASR datasets documentation, read 2026-10-15
      - id: lhotse
        name: Lhotse
        role: Speech data loading from Lhotse Shar shards
        connection: Shard sources given as pipe commands with an S3 client and the B2 endpoint, or as s3 URIs opened through smart_open
        connection_type: native-s3-output
        url: https://github.com/lhotse-speech/lhotse
        evidence: CutSet.from_shar and open_best source docstrings, read 2026-10-15
      - id: webdataset
        name: WebDataset
        role: Tar-shard data loading
        connection: Shard URLs as pipe commands with an S3 client and the B2 endpoint, or presigned https URLs read with curl
        connection_type: native-s3-output
        url: https://github.com/webdataset/webdataset
        evidence: README and URL scheme table in gopen.py, read 2026-10-15
      - id: huggingface-datasets
        name: Hugging Face Datasets
        role: Dataset loading and streaming from JSON or WebDataset files
        connection: storage_options passed to the s3fs backend with the B2 endpoint_url
        connection_type: native-s3-output
        url: https://huggingface.co/docs/datasets/package_reference/loading_methods
        evidence: Loading methods reference and s3fs documentation, read 2026-10-15
      - id: mosaicml-streaming
        name: MosaicML Streaming
        role: Streaming MDS shards into a local cache during training
        connection: S3_ENDPOINT_URL set to the B2 S3 endpoint; remote s3 path and local cache directory
        connection_type: native-s3-output
        url: https://docs.mosaicml.com/projects/streaming/en/stable/how_to_guides/configure_cloud_storage_credentials.html
        evidence: Cloud storage credentials guide lists Backblaze B2, read 2026-10-15
      - id: label-studio
        name: Label Studio
        role: Transcript and label review
        connection: Amazon S3 storage type with the S3 endpoint field set to B2; source storage with pre-signed URLs and target storage for annotations
        connection_type: native-s3-output
        url: https://labelstud.io/guide/storage_s3
        evidence: Amazon S3 storage guide, read 2026-10-15
      - id: mlflow
        name: MLflow
        role: Experiment tracking and artifact storage
        connection: Artifact root on an s3 path with MLFLOW_S3_ENDPOINT_URL set to the B2 S3 endpoint
        connection_type: native-s3-output
        url: https://mlflow.org/docs/latest/self-hosting/architecture/artifact-store/
        evidence: Artifact store documentation, read 2026-10-15
      - id: dvc
        name: DVC
        role: Data versioning pinned by Git commits
        connection: S3 remote with endpointurl set to the B2 S3 endpoint
        connection_type: native-s3-output
        url: https://doc.dvc.org/user-guide/data-management/remote-storage/amazon-s3
        evidence: Amazon S3 remote documentation, read 2026-10-15
    prerequisites:
      - A B2 account with four private buckets, one per zone
      - Event Notifications enabled for the account, or a polling fallback
      - A queue or job runner outside B2
      - A consent service and a validation worker
      - Local disk or a cluster cache on the training hosts
    expected_scale:
      profile: From thousands of clips to multi-terabyte speech corpora
      notes: Collection and review run at any scale on standard B2. Training reads go through a local cache; B2 Overdrive applies only when sustained aggregate read throughput is the measured constraint.
    validation:
      status: source-reviewed-and-automated-tests
      date: "2026-10-26"
      methods:
        - Third-party behavior checked against each tool's official documentation or source code on 2026-10-15
        - B2 behavior checked against the Backblaze documentation linked from the capability map
        - Release manifest example validated against its schema and recomputed from the synthetic fixtures in CI
        - Application tests run in CI against an emulated S3 server
        - On 2026-10-16 the opt-in live check (not part of CI) passed once against a real B2 test bucket for authentication and the endpoint derived from the region, put, get, head, list, presigned PUT, multipart upload resumed after an interruption, presigned URL expiry and delete
        - On 2026-10-26 a manual walkthrough of the voice-dataset-ingest commands (not the opt-in live check) ran against a real B2 test bucket with Object Lock and SSE-B2 for upload, process, release with GOVERNANCE retention read back with head_object, refusal of a repeated release, refusal of an upload with an unknown consent id, and a presigned PUT
        - "Not validated live as of 2026-10-26: deletion after retention expires, bucket configuration (templates checked for shape only), Event Notification delivery, and the named tools"
      evidence:
        - architectures/voice-training-data-lifecycle/architecture.md
        - docs/b2-capabilities.md
        - applications/voice-dataset-ingest/tests/
        - applications/voice-dataset-ingest/tests/test_live.py
        - https://docs.nvidia.com/nemo-framework/user-guide/latest/nemotoolkit/asr/datasets.html
        - https://github.com/lhotse-speech/lhotse/blob/master/lhotse/cut/set.py
        - https://github.com/webdataset/webdataset
        - https://huggingface.co/docs/datasets/package_reference/loading_methods
        - https://docs.mosaicml.com/projects/streaming/en/stable/how_to_guides/configure_cloud_storage_credentials.html
        - https://labelstud.io/guide/storage_s3
        - https://mlflow.org/docs/latest/self-hosting/architecture/artifact-store/
        - https://doc.dvc.org/user-guide/data-management/remote-storage/amazon-s3
    security_considerations:
      - One application key per component and prefix, read-only and expiring for training jobs
      - Presigned PUT URLs for one object with a short expiry
      - Webhook signature verified on the raw body and each eventId processed once
      - SSE-B2 default encryption; object names and metadata carry pseudonymous ids only
      - CORS limited to the contributor app and Label Studio origins
    compliance_considerations:
      - Consent recorded before upload and kept under Object Lock in governance mode
      - Consent withdrawal excludes the speaker from later releases and allows affected releases to be removed
      - Transcripts redacted for personal data before review
      - Retention per zone through lifecycle rules and Object Lock
      - Provenance from clip hash and consent id to release fingerprint and training run
    links:
      architecture: architectures/voice-training-data-lifecycle/architecture.md
      application: applications/voice-dataset-ingest/README.md
      deployment: infrastructure/b2-provisioning/README.md
      sample_data: testdata/synthetic-speech/README.md
      release_contract: schemas/release-manifest.schema.json
  - id: batch-voice-generation-and-dubbing
    name: Batch voice generation and dubbing
    slug: batch-voice-generation-and-dubbing
    summary: Send sources to dubbing, speech synthesis and transcription providers through presigned GET URLs, keep every output as an expiring candidate, and promote reviewed outputs to immutable deliveries with lineage.
    audience:
      - Backend engineers
      - Media pipeline engineers
      - ML engineers
      - Platform engineers
    problem: Batch dubbing, speech synthesis and transcription jobs produce many outputs from hosted providers that return results through their own APIs; each output needs review, unused outputs must expire, and every delivered file must trace back to its source, job and consent.
    workflow:
      - Upload the source to the incoming zone
      - Start a job on a signed Event Notification and check consent
      - Submit the job with a presigned GET URL sized to the provider's download window
      - Collect outputs on callback or by polling and copy them to candidates
      - Review candidates through short-lived presigned URLs
      - Promote approved outputs to an immutable delivery version with lineage
      - Deliver through short-lived URLs or a private CDN while candidates expire
    boundaries:
      - real-time-voice-transport
      - low-latency-session-store
      - message-queue
      - transcription-or-voice-model
      - workflow-orchestrator
      - metadata-catalog
      - vector-database
      - gpu-cache-or-training-storage
    capabilities:
      - S3-compatible API
      - Presigned URLs and CORS
      - Multipart upload with resume
      - Application keys with limited scope
      - Event Notifications with a signed, idempotent webhook
      - Versions and lifecycle rules
      - Server-side encryption
      - Object Lock
      - Cloud Replication
      - Private delivery through a CDN
      - Delivery through compute partners
      - Local processing or GPU cache
    integrations:
      - id: elevenlabs-dubbing
        name: ElevenLabs Dubbing
        role: Dubbing into other languages, with speaker detection and voice cloning
        connection: Reads the source from a presigned GET URL passed as source_url; the application downloads the dubbed audio and subtitles from the signed output URLs and writes them to B2
        connection_type: application-copy
        url: https://elevenlabs.io/docs/api-reference/dubbing/create-project
        evidence: Dubbing project, language target and webhooks API reference, read 2026-10-15
      - id: deepgram
        name: Deepgram
        role: Pre-recorded transcription, diarization and English audio intelligence
        connection: Reads the source from a presigned GET URL in the url field; the transcript returns in the response or by callback and the application writes it to B2
        connection_type: application-copy
        url: https://developers.deepgram.com/docs/pre-recorded-audio
        evidence: Pre-recorded audio, callback and S3 presigned URL guides, read 2026-10-15
      - id: assemblyai
        name: AssemblyAI
        role: Batch transcription, speaker labels and transcript analysis
        connection: Reads the source from a presigned GET URL passed as audio_url; the application fetches the transcript after the webhook or by polling and writes it to B2
        connection_type: application-copy
        url: https://www.assemblyai.com/docs/api-reference/transcripts/submit
        evidence: Submit transcript reference, webhooks guide and common errors guide, read 2026-10-15
      - id: cloudflare-cdn
        name: Cloudflare CDN
        role: Private delivery of approved outputs
        connection: A Cloudflare Worker signs each request to the private releases bucket's S3 endpoint with an application key scoped to deliveries
        connection_type: native-s3-output
        url: https://www.backblaze.com/docs/cloud-storage-deliver-private-backblaze-b2-content-through-cloudflare-cdn
        evidence: Backblaze guide for private content through Cloudflare CDN, linked from the capability map, read 2026-10-15
    prerequisites:
      - A B2 account with four private buckets, one per zone
      - Event Notifications enabled for the account, or a polling fallback
      - A queue and job runner outside B2
      - An account with each hosted provider used, or a self-hosted model
      - A public HTTPS endpoint for provider callbacks, or polling
      - A consent service and a review tool
    expected_scale:
      profile: From a few jobs a day to continuous batches of dubbing and transcription
      notes: Throughput is bound by the providers' job limits and the runner's concurrency, not by B2. Each output is stored at least twice while a candidate and its delivery coexist; candidate lifecycle bounds that overlap.
    validation:
      status: source-reviewed-and-automated-tests
      date: "2026-10-26"
      methods:
        - Provider behavior checked against ElevenLabs, Deepgram and AssemblyAI documentation on 2026-10-15
        - B2 behavior checked against the Backblaze documentation linked from the capability map
        - Generation job manifest example validated against its schema in CI
        - Application tests run in CI against an emulated S3 server
        - On 2026-10-16 the opt-in live check (not part of CI) passed once against a real B2 test bucket for authentication and the endpoint derived from the region, put, get, list, server-side copy, presigned GET, presigned URL expiry and delete
        - On 2026-10-26 a manual walkthrough of the voice-generation-artifacts commands (not the opt-in live check) ran against a real B2 test bucket with Object Lock and SSE-B2 for synth-source, submit, promote with approval and deliver (seven presigned URLs answered 200, an unsigned GET 401), with the manifest written last, the delivered objects matching the manifest SHA-256 and the refusal of a repeated submit, a promote without approval, a repeated promote and invalid arguments
        - "A second manual run on 2026-10-26, after the consent check and `review` were added, ran `submit` with a valid consent record per speaker (accepted, consent ids in the manifest) and refused an unknown consent id, a record of another speaker and a speaker without a record with exit code 2 and nothing written, and ran `review` (one presigned URL answered 200 and its unsigned form 401, `--out` wrote a file readable by its owner only with no URL on stdout, an out-of-range `--expires` was refused with exit code 2), then `promote --approve` and `deliver`."
        - "Not validated live as of 2026-10-26: candidate expiry by lifecycle and cleanup, bucket configuration (templates checked for shape only), and ElevenLabs, Deepgram and AssemblyAI"
      evidence:
        - architectures/batch-voice-generation-and-dubbing/architecture.md
        - docs/b2-capabilities.md
        - applications/voice-generation-artifacts/tests/
        - applications/voice-generation-artifacts/tests/test_live.py
        - https://elevenlabs.io/docs/api-reference/dubbing/create-project
        - https://elevenlabs.io/docs/api-reference/dubbing/language-targets/get-language-target
        - https://elevenlabs.io/docs/eleven-api/resources/webhooks
        - https://developers.deepgram.com/docs/callback
        - https://developers.deepgram.com/docs/using-aws-s3-presigned-urls-with-the-deepgram-api
        - https://www.assemblyai.com/docs/api-reference/transcripts/submit
        - https://www.assemblyai.com/docs/deployment/webhooks
        - https://www.assemblyai.com/docs/pre-recorded-audio/guides/common_errors_and_solutions
    security_considerations:
      - One presigned GET URL per job and object version, signed just before submission; hosted providers never receive a key
      - Presigned URL lifetime longer than the provider's download window and recorded in the job manifest, never the URL itself
      - Provider callbacks verified by signature or configured credentials and handled idempotently
      - One application key per component and prefix; delivery keys read-only and scoped to deliveries
      - SSE-B2 default encryption; object names and metadata carry job ids and pseudonymous speaker ids only
    compliance_considerations:
      - Speaker consent, including voice cloning, checked before every submission
      - Provider retention and data-use terms checked against consent before sending recordings
      - Unpromoted candidates and sources expire through lifecycle rules
      - Consent withdrawal stops new jobs and allows affected deliveries to be removed
      - Lineage from delivered file to source version, job and consent ids
    links:
      architecture: architectures/batch-voice-generation-and-dubbing/architecture.md
      application: applications/voice-generation-artifacts/README.md
      deployment: infrastructure/b2-provisioning/README.md
      sample_data: testdata/synthetic-speech/README.md
      release_contract: schemas/generation-job-manifest.schema.json
  - id: voice-agent-session-archive
    name: Voice agent session archive
    slug: voice-agent-session-archive
    summary: Archive finished voice agent sessions from LiveKit Egress or a session adapter, evaluate each session for quality and safety, retain it per class under Object Lock, and select only passed, consented sessions for review, analytics or datasets.
    audience:
      - Backend engineers
      - Voice agent developers
      - ML engineers
      - Platform engineers
    problem: Voice agent platforms produce recordings, tracks, transcripts and events that must be kept for a defined period, traced to consent, and checked before anyone reuses them; LiveKit Egress writes them to B2 directly, and an adapter copies them from the other platforms.
    workflow:
      - Record the session with LiveKit Egress to B2, or copy it from the platform with an adapter
      - Write the session manifest last, when the session has ended
      - Start evaluation on a signed Event Notification for the manifest
      - Run quality and safety checks and record the result and eligible uses
      - Copy sessions to the protected zone with retention per class
      - Retrieve sessions through short-lived presigned URLs issued by the application
      - Select passed sessions whose consent covers the use into dataset releases
    boundaries:
      - real-time-voice-transport
      - low-latency-session-store
      - message-queue
      - transcription-or-voice-model
      - workflow-orchestrator
      - metadata-catalog
      - vector-database
      - gpu-cache-or-training-storage
    capabilities:
      - S3-compatible API
      - Presigned URLs and CORS
      - Multipart upload with resume
      - Application keys with limited scope
      - Event Notifications with a signed, idempotent webhook
      - Versions and lifecycle rules
      - Server-side encryption
      - Object Lock
      - Cloud Replication
      - Local processing or GPU cache
    integrations:
      - id: livekit-egress
        name: LiveKit Egress
        role: Recording of voice agent rooms and tracks
        connection: S3 output with the B2 endpoint, force_path_style and a key limited to sessions/ in the incoming bucket; template in infrastructure/livekit-egress
        connection_type: native-s3-output
        url: https://docs.livekit.io/home/egress/outputs/
        evidence: Egress outputs, Egress API and webhooks documentation, read 2026-10-15
      - id: pipecat
        name: Pipecat
        role: Voice agent pipelines that buffer user and bot audio
        connection: AudioBufferProcessor hands mixed or per-track PCM to the application, which converts it and uploads it to B2
        connection_type: application-copy
        url: https://docs.pipecat.ai/server/utilities/audio/audio-buffer-processor
        evidence: AudioBufferProcessor documentation, read 2026-10-15
      - id: twilio
        name: Twilio Voice
        role: Call and conference recordings
        connection: The recording status callback triggers the adapter, which downloads the media with HTTP Basic authentication and writes it to B2; Twilio external storage supports AWS S3 only
        connection_type: application-copy
        url: https://www.twilio.com/docs/voice/api/recording
        evidence: Recording resource, recording settings and webhook security documentation, read 2026-10-15
      - id: daily
        name: Daily
        role: Cloud and raw-tracks recordings of calls
        connection: The recording.ready-to-download webhook triggers the adapter, which downloads the file through the recording access link API and writes it to B2; Daily custom storage supports Amazon S3 only, with OCI by request
        connection_type: application-copy
        url: https://docs.daily.co/reference/rest-api/recordings/get-recording-link
        evidence: Custom S3 bucket guide, webhook event, access link and webhooks reference, read 2026-10-15
      - id: vapi
        name: Vapi
        role: Hosted voice agent call recordings and logs
        connection: After the end-of-call-report event, the adapter fetches recordings from the authenticated artifact endpoints, which redirect to short-lived signed URLs, and writes them to B2
        connection_type: application-copy
        url: https://docs.vapi.ai/security-and-privacy/retrieve-call-artifacts
        evidence: Retrieve call artifacts, call recording, data flow and server events documentation, read 2026-10-15
    prerequisites:
      - A B2 account with four private buckets, one per zone, with Object Lock on the protected bucket
      - Event Notifications enabled for the account, or a polling fallback
      - A queue and job runner outside B2
      - A voice platform with recording enabled, and a session adapter for platforms other than LiveKit Egress
      - A consent service, a session evaluator and an application that authorizes retrieval
    expected_scale:
      profile: From a few sessions a day to continuous call volume
      notes: Capture and archive scale with the platform's recording throughput, not with B2. Each retained session is stored twice until the incoming copy expires; the incoming lifecycle bounds that overlap.
    validation:
      status: source-reviewed-and-automated-tests
      date: "2026-10-26"
      methods:
        - Platform behavior checked against LiveKit, Pipecat, Twilio, Daily and Vapi documentation on 2026-10-15
        - B2 behavior checked against the Backblaze documentation linked from the capability map
        - Session manifest example and synthetic session fixture validated against their schema in CI
        - Application tests run in CI against an emulated S3 server and signed sample LiveKit webhooks
        - On 2026-10-16 the opt-in live check (not part of CI, no LiveKit server involved) passed once against a real B2 test bucket for authentication and the endpoint derived from the region, put, head, get, the recording written before the session manifest, the manifest round trip and delete
        - On 2026-10-26 a manual walkthrough of the voice-session-archive commands (not the opt-in live check) ran against a real B2 test bucket with Object Lock and SSE-B2, with a stand-in for Egress and no LiveKit server, for register-session, handle-webhook (archived, then duplicate), evaluate and serve on the loopback interface, with the recording and session.json written before the first manifest version and the refusal of a wrong secret, a missing Authorization header, a changed body and a duplicate registration
        - "A second manual run on 2026-10-26, after the exit code and the demo consent id changed, confirmed that `synth --put` writes a separate consent record per session without overwriting another, that `evaluate` printed `passed` and exited 0 for a session with a valid consent record, and that it printed `failed`, exited 3 and still wrote the evaluation result and the manifest for a session whose registered consent id has no record."
        - "Not validated live as of 2026-10-26: lifecycle expiry and cleanup, LiveKit Egress, real webhook delivery, bucket configuration (templates checked for shape only), and the named platforms"
      evidence:
        - architectures/voice-agent-session-archive/architecture.md
        - docs/b2-capabilities.md
        - applications/voice-session-archive/tests/
        - applications/voice-session-archive/tests/test_live.py
        - https://docs.livekit.io/home/egress/outputs/
        - https://docs.livekit.io/home/egress/api/
        - https://docs.livekit.io/home/server/webhooks/
        - https://docs.pipecat.ai/server/utilities/audio/audio-buffer-processor
        - https://www.twilio.com/docs/voice/api/recording
        - https://www.twilio.com/docs/voice/recording-settings
        - https://docs.daily.co/guides/products/live-streaming-recording/storing-recordings-in-a-custom-s3-bucket
        - https://docs.daily.co/reference/rest-api/recordings/get-recording-link
        - https://docs.vapi.ai/security-and-privacy/retrieve-call-artifacts
        - https://docs.vapi.ai/security-and-privacy/data-flow
    security_considerations:
      - Only the Egress key reaches a platform, limited to sessions/ in the incoming bucket
      - Platform API credentials kept in the adapter; platform download links fetched server-side and never stored
      - Event Notification, LiveKit, Twilio and Daily webhooks verified before acting and each event processed once
      - Retrieval through short-lived presigned GET URLs issued after the application authorizes the person
      - SSE-B2 default encryption; object names and metadata carry session ids and pseudonymous participant ids only
    compliance_considerations:
      - Quality and safety evaluation before any session can be selected for review, analytics or model improvement
      - Eligible uses limited to what the consent record permits, and consent re-checked at selection time
      - Retention per class with Object Lock in governance mode and legal hold where required
      - Consent withdrawal removes the session from later selections and allows affected releases to be removed
      - Provenance from dataset file to session, evaluation and consent ids
    links:
      architecture: architectures/voice-agent-session-archive/architecture.md
      application: applications/voice-session-archive/README.md
      deployment: infrastructure/livekit-egress/README.md
      sample_data: testdata/synthetic-speech/README.md
      release_contract: schemas/session-manifest.schema.json
