[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-dataset-ingest"
version = "0.1.0"
description = "Consent-gated ingest, validation, normalization and release of speech datasets on Backblaze B2"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "boto3>=1.34,<2",
    "jsonschema>=4.23,<5",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
voice-dataset-ingest = "voice_dataset_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_dataset_ingest = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: runs against a real B2 bucket; needs RUN_B2_LIVE_TESTS=1 and the B2_* variables",
]
